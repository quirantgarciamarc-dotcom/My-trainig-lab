name: Build and deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure GitHub Pages base path
        env:
          EXPO_PUBLIC_BASE_URL: /My-trainig-lab
        run: |
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('app.json','utf8')); p.expo.experiments={...(p.expo.experiments||{}),baseUrl:process.env.EXPO_PUBLIC_BASE_URL}; fs.writeFileSync('app.json',JSON.stringify(p,null,2));"
          node -e "const fs=require('node:fs'); const p='public/manifest.webmanifest'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.start_url='/My-trainig-lab/'; m.scope='/My-trainig-lab/'; m.icons=m.icons.map(i=>({...i,src:'/My-trainig-lab'+i.src})); fs.writeFileSync(p,JSON.stringify(m,null,2));"

      - name: Export web app
        env:
          EXPO_PUBLIC_BASE_URL: /My-trainig-lab
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_COACH_API_URL: ${{ secrets.EXPO_PUBLIC_COACH_API_URL }}
        run: npx expo export -p web

      - name: Verify web output
        run: test -f dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
